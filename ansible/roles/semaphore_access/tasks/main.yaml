---
- name: Create Semaphore user
  ansible.builtin.user:
    name: '{{ semaphore_access_user }}'
    shell: /bin/bash
    password: '!'
    password_lock: true

- name: Create Semaphore .ssh directory
  ansible.builtin.file:
    path: '/home/{{ semaphore_access_user }}/.ssh'
    state: directory
    owner: '{{ semaphore_access_user }}'
    group: '{{ semaphore_access_user }}'
    mode: '0700'

- name: Install Semaphore authorized key
  ansible.builtin.copy:
    content: "{{ semaphore_access_public_key }}\n"
    dest: '/home/{{ semaphore_access_user }}/.ssh/authorized_keys'
    owner: '{{ semaphore_access_user }}'
    group: '{{ semaphore_access_user }}'
    mode: '0600'

- name: Allow Semaphore passwordless sudo
  ansible.builtin.copy:
    content: "{{ semaphore_access_user }} ALL=(ALL) NOPASSWD: ALL\n"
    dest: '/etc/sudoers.d/{{ semaphore_access_user }}'
    owner: root
    group: root
    mode: '0440'
    validate: '/usr/sbin/visudo -cf %s'
