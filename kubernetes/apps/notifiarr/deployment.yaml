---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: notifiarr
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: notifiarr
  template:
    metadata:
      labels:
        app.kubernetes.io/name: notifiarr
    spec:
      serviceAccountName: notifiarr
      automountServiceAccountToken: false
      # notifiarr.com identifies each client by its hostname, so keep it static
      hostname: notifiarr-k3s
      containers:
        - name: notifiarr
          image: ghcr.io/notifiarr/notifiarr
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 5454
              protocol: TCP
          envFrom:
            - configMapRef:
                name: notifiarr-config
            - secretRef:
                name: notifiarr-secret
          resources:
            limits:
              memory: 256Mi
            requests:
              memory: 128Mi
          volumeMounts:
            - name: config
              mountPath: /config
      volumes:
        # Stateless: configuration comes from env vars, the client still expects writable directory
        - name: config
          emptyDir: {}
      nodeSelector:
        worker: "true"
