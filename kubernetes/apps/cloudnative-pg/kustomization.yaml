---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - namespace: cnpg-system
    name: cloudnative-pg
    releaseName: cnpg
    repo: https://cloudnative-pg.github.io/charts
    includeCRDs: true
    version: 0.27.0

resources:
  - namespace.yaml
  - cnpg-storageclass.yaml
  - psql-cluster.yaml
  - ingress.yaml
