---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pg-ingress-tcp
  namespace: prod
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - pg
  tls:
    secretName: home-lungoo-de-tls
  routes:
    - match: HostSNI(`pg.home.lungoo.de`)
      services:
        - name: psql-cluster-rw
          port: 5432
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pg-ingress-tcp
  namespace: testing
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - pg
  tls:
    secretName: home-lungoo-de-tls
  routes:
    - match: HostSNI(`pg-testing.home.lungoo.de`)
      services:
        - name: psql-cluster-rw
          port: 5432
