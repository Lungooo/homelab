---
apiVersion: traefik.io/v1alpha1
kind: TLSOption
metadata:
  name: postgresql
  namespace: prod

spec:
  alpnProtocols:
    - postgresql
---
apiVersion: traefik.io/v1alpha1
kind: IngressRouteTCP
metadata:
  name: pg-ingress-tcp
  namespace: prod
spec:
  entryPoints:
    - pg
  ingressClassName: traefik-external
  tls:
    options:
      name: postgresql
  routes:
    - match: HostSNI(`pg.home.lungoo.de`)
      services:
        - name: psql-cluster-rw
          port: 5432
