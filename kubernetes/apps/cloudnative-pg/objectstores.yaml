---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backups
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  configuration:
    destinationPath: s3://cnpg-backups/
    endpointURL: http://garage-s3-service.external-services:3900
    s3Credentials:
      accessKeyId:
        name: cnpg-backups-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backups-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
---
apiVersion: barmancloud.cnpg.io/v1
kind: ObjectStore
metadata:
  name: cnpg-backups-v2
  namespace: prod
  annotations:
    argocd.argoproj.io/sync-wave: "1"
spec:
  configuration:
    destinationPath: s3://cnpg-backups-v2/
    endpointURL: http://garage-s3-service.external-services:3900
    s3Credentials:
      accessKeyId:
        name: cnpg-backups-credentials
        key: ACCESS_KEY_ID
      secretAccessKey:
        name: cnpg-backups-credentials
        key: ACCESS_SECRET_KEY
    wal:
      compression: gzip
  retentionPolicy: "30d"
