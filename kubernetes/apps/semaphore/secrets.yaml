---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-ansible-vars
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      data:
        forgejo.yaml: |
          ---
          forgejo_lfs_jwt_secret: {{ .forgejo_lfs_jwt_secret | quote }}
          forgejo_jwt_secret: {{ .forgejo_jwt_secret | quote }}
          forgejo_internal_token: {{ .forgejo_internal_token | quote }}
  data:
    - secretKey: forgejo_lfs_jwt_secret
      remoteRef:
        key: "e484223d-9cb6-4f22-b7ae-b4f201346a84"
    - secretKey: forgejo_jwt_secret
      remoteRef:
        key: "5b56a51e-78bb-4f79-9e59-b4f201347256"
    - secretKey: forgejo_internal_token
      remoteRef:
        key: "7f32a19e-b0e2-4b48-aab4-b4f2013479e1"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psql-cluster-semaphore-role
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "semaphore"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "semaphore"
      engineVersion: v2
      mergePolicy: Merge
      data:
        username: semaphore
  data:
    - secretKey: password
      remoteRef:
        key: "11b99db2-da23-4f82-8876-b4f20132e1ee"
