---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-general-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: cookieHash
      remoteRef:
        key: "3d05cb38-0fcb-46c1-9f97-b4f2013286ea"
    - secretKey: cookieEncryption
      remoteRef:
        key: "f86aba19-2023-4508-9ecf-b4f20132a66e"
    - secretKey: accesskeyEncryption
      remoteRef:
        key: "70297901-b2c6-4be0-a697-b4f20132b1c0"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-runner-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: token
      remoteRef:
        key: "47ff35b9-d6fe-43a7-b59e-b4f20132c198"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: semaphore-admin-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      engineVersion: v2
      mergePolicy: Merge
      data:
        fullname: "Semaphore Admin"
        username: "admin"
        email: "admin@lungoo.dev"
  data:
    - secretKey: password
      remoteRef:
        key: "74ab7ed5-ea06-4748-9d1c-b4f20132cf35"
