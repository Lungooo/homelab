---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - namespace: semaphore
    name: semaphore
    releaseName: semaphore
    repo: https://semaphoreui.github.io/charts
    skipTests: true
    valuesFile: values.yaml
    version: 16.2.2

resources:
  - database.yaml
  - ingress.yaml
  - secrets.yaml
