---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - namespace: sure
    name: sure
    releaseName: sure
    repo: https://we-promise.github.io/sure
    skipTests: true
    valuesFile: values.yaml
    version: 0.7.6

images:
  - name: ghcr.io/valkey-io/valkey
    newTag: 9.1.3@sha256:3add1a336a920ea54770a001ab6feb3da5fceea96a40373a3a2cd469b815f0b7

patches:
  - target:
      kind: Deployment
      name: sure-(web|worker)
    patch: |-
      - op: add
        path: /metadata/annotations
        value:
          reloader.stakater.com/auto: "true"

resources:
  - database.yaml
  - deployment-valkey.yaml
  - ingress.yaml
  - pvcs.yaml
  - secrets.yaml
  - serviceaccount.yaml
  - services.yaml
