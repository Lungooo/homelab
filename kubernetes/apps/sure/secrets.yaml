---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-app-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      mergePolicy: Merge
      data:
        DATABASE_URL: "postgresql://sure:{{ .db_password | urlquery }}@psql-cluster-rw.prod.svc.cluster.local:5432/sure?sslmode=require"
        REDIS_URL: "redis://default:{{ .valkey_password | urlquery }}@sure-valkey:6379/0"
  data:
    - secretKey: SECRET_KEY_BASE
      remoteRef:
        key: "90b995f8-c234-4fe1-ae8d-b5020152d177"
    - secretKey: ACTIVE_RECORD_ENCRYPTION_PRIMARY_KEY
      remoteRef:
        key: "ed39a514-5307-4254-8d44-b502015310a7"
    - secretKey: ACTIVE_RECORD_ENCRYPTION_DETERMINISTIC_KEY
      remoteRef:
        key: "4bc0fa82-26e7-495e-b33a-b502015330a2"
    - secretKey: ACTIVE_RECORD_ENCRYPTION_KEY_DERIVATION_SALT
      remoteRef:
        key: "c58e3a22-8e50-4508-b5dd-b502015345e5"
    - secretKey: db_password
      remoteRef:
        key: "552b5612-6e3f-4861-83cf-b50201539a08"
    - secretKey: valkey_password
      remoteRef:
        key: "c4b531d4-9cda-4b5b-ab8c-b5020153b1ca"
    - secretKey: OIDC_CLIENT_SECRET
      remoteRef:
        key: "2e22b47e-8613-4eef-8340-b50201545773"
    - secretKey: GENERIC_S3_ACCESS_KEY_ID
      remoteRef:
        key: "d1a63aef-8760-4dc1-a859-b502015508a4"
    - secretKey: GENERIC_S3_SECRET_ACCESS_KEY
      remoteRef:
        key: "a2d349c9-b9b3-4468-a205-b50201552a00"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: sure-valkey-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      data:
        password: "{{ .password }}"
        valkey.conf: |
          requirepass {{ .password }}
  data:
    - secretKey: password
      remoteRef:
        key: "c4b531d4-9cda-4b5b-ab8c-b5020153b1ca"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psql-cluster-sure-role
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      mergePolicy: Merge
      data:
        username: sure
  data:
    - secretKey: password
      remoteRef:
        key: "552b5612-6e3f-4861-83cf-b50201539a08"
