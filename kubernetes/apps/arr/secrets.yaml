---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psql-cluster-prowlarr-role
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      mergePolicy: Merge
      data:
        username: prowlarr
  data:
    - secretKey: password
      remoteRef:
        key: "44715704-2069-4d7e-ae67-b47700909bf4"
