---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: sabnzbdvpn-ingress
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-external
  tls:
    secretName: home-lungoo-de-tls
  routes:
    - match: Host(`sabnzbdvpn.home.lungoo.de`)
      kind: Rule
      services:
        - name: sabnzbdvpn
          port: 8080
