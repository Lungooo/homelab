---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: actual-budget-ingress
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-external
  routes:
    - match: Host(`actual-budget.home.lungoo.de`)
      kind: Rule
      services:
        - name: actual-budget-service
          port: 5006
