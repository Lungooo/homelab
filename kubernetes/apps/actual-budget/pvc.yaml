---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: actual-budget-pvc
  labels:
    recurring-job.longhorn.io/source: enabled
    recurring-job.longhorn.io/snapshot: enabled
    recurring-job.longhorn.io/backup: enabled
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: longhorn
  resources:
    requests:
      storage: 1Gi
