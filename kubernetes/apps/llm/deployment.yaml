---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: llama-cpu
  annotations:
    reloader.stakater.com/auto: "true"
spec:
  replicas: 1
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app.kubernetes.io/name: llama-cpu
  template:
    metadata:
      labels:
        app.kubernetes.io/name: llama-cpu
    spec:
      serviceAccountName: llama-cpu
      automountServiceAccountToken: false
      securityContext:
        runAsNonRoot: true
        runAsUser: 1000
        runAsGroup: 1000
        fsGroup: 1000
        fsGroupChangePolicy: OnRootMismatch
        seccompProfile:
          type: RuntimeDefault
      containers:
        - name: llama-server
          image: ghcr.io/ggml-org/llama.cpp
          imagePullPolicy: IfNotPresent
          command: ["/app/llama-server"]
          securityContext:
            allowPrivilegeEscalation: false
            capabilities:
              drop:
                - ALL
          args:
            - "-hf"
            - "unsloth/Ministral-3-8B-Instruct-2512-GGUF:UD-Q4_K_XL"
            - "--alias"
            - "ministral-3-8b"
            - "--host"
            - "0.0.0.0"
            - "--port"
            - "8080"
            - "--api-key-file"
            - "/secrets/llama/api-key"
            - "-c"
            - "8192"
            - "-np"
            - "1"
            - "-t"
            - "4"
            - "-tb"
            - "4"
            - "-ngl"
            - "0"
            - "--temp"
            - "0"
            - "--jinja"
          env:
            - name: LLAMA_CACHE
              value: /models
            - name: HOME
              value: /tmp
          ports:
            - name: http
              containerPort: 8080
              protocol: TCP
          startupProbe:
            httpGet:
              path: /health
              port: http
            failureThreshold: 120
            periodSeconds: 10
          livenessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 30
            timeoutSeconds: 5
            failureThreshold: 5
          readinessProbe:
            httpGet:
              path: /health
              port: http
            periodSeconds: 10
            timeoutSeconds: 5
          resources:
            requests:
              cpu: 500m
              memory: 8Gi
            limits:
              memory: 9Gi
          volumeMounts:
            - name: models
              mountPath: /models
            - name: api-key
              mountPath: /secrets/llama
              readOnly: true
      volumes:
        - name: models
          persistentVolumeClaim:
            claimName: llama-cpu-models
        - name: api-key
          secret:
            secretName: llama-cpu-api-key
      nodeSelector:
        llm: "true"
