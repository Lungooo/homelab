---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: llama-cpu-api-key
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      metadata:
        annotations:
          reflector.v1.k8s.emberstack.com/reflection-allowed: "true"
          reflector.v1.k8s.emberstack.com/reflection-allowed-namespaces: "sure"
          reflector.v1.k8s.emberstack.com/reflection-auto-enabled: "true"
          reflector.v1.k8s.emberstack.com/reflection-auto-namespaces: "sure"
  data:
    - secretKey: api-key
      remoteRef:
        key: "b385728c-88a8-40d2-9141-b502013c1098"
