---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: seerr-secret
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: DB_PASS
      remoteRef:
        key: "e2ad7edf-ae8c-4188-b05f-b47501584c94"
---
apiVersion: external-secrets.io/v1
kind: ExternalSecret
metadata:
  name: psql-cluster-seerr-role
  namespace: prod
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  target:
    template:
      type: kubernetes.io/basic-auth
      metadata:
        labels:
          cnpg.io/reload: "true"
      mergePolicy: Merge
      data:
        username: seerr
  data:
    - secretKey: password
      remoteRef:
        key: "e2ad7edf-ae8c-4188-b05f-b47501584c94"
