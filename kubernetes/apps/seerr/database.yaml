kind: DatabaseRole
metadata:
  name: psql-cluster-seerr
  namespace: prod
spec:
  cluster:
    name: psql-cluster
  name: seerr
  login: true
  passwordSecret:
    name: psql-cluster-seerr-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: psql-cluster-seerr
  namespace: prod
spec:
  name: seerr
  owner: seerr
  cluster:
    name: psql-cluster
