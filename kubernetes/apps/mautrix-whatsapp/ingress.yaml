---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mautrix-whatsapp-ingress
  annotations:
    kubernetes.io/ingress.class: traefik-external
spec:
  entryPoints:
    - websecure
  tls:
    secretName: home-lungoo-de-tls
  routes:
    - match: Host(`mautrix-whatsapp.home.lungoo.de`)
      kind: Rule
      services:
        - name: mautrix-whatsapp
          port: 29318