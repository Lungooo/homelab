---
apiVersion: traefik.io/v1alpha1
kind: IngressRoute
metadata:
  name: mautrix-whatsapp-ingress
spec:
  entryPoints:
    - websecure
  ingressClassName: traefik-external
  tls:
    secretName: home-lungoo-de-tls
  routes:
    - match: Host(`mautrix-whatsapp.home.lungoo.de`)
      kind: Rule
      services:
        - name: mautrix-whatsapp
          port: 29318