---
apiVersion: cert-manager.io/v1
kind: Certificate
metadata:
  name: home-lungoo-de
  namespace: traefik
spec:
  secretName: home-lungoo-de-tls
  issuerRef:
    name: zerossl-production
    kind: ClusterIssuer
  commonName: "*.home.lungoo.de"
  dnsNames:
    - "home.lungoo.de"
    - "*.home.lungoo.de"
