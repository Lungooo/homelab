---
apiVersion: cert-manager.io/v1
kind: ClusterIssuer
metadata:
  name: zerossl-production
spec:
  acme:
    server: https://acme.zerossl.com/v2/DV90
    privateKeySecretRef:
      name: zerossl-production

    externalAccountBinding:
      keyID: HqBDCWY9Vk_ZaX2AQZDzQg
      keySecretRef:
        name: zerossl-eab-secret
        key: eab-key

    solvers:
      - dns01:
          webhook:
            groupName: com.netcup.webhook
            solverName: netcup
            config:
              secretRef: netcup-secret
              secretNamespace: cert-manager
        selector:
          dnsZones:
            - "lungoo.de"
