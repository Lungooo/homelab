---
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: kube-multus-ds
  namespace: kube-system
spec:
  template:
    spec:
      containers:
        - name: kube-multus
          volumeMounts:
            - name: k3s-data
              mountPath: /var/lib/rancher/k3s/data
      volumes:
        - name: cni
          hostPath:
            path: /var/lib/rancher/k3s/agent/etc/cni/net.d
        - name: cnibin
          hostPath:
            path: /var/lib/rancher/k3s/data/cni
        - name: k3s-data
          hostPath:
            path: /var/lib/rancher/k3s/data
