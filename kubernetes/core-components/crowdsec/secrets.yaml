kind: ExternalSecret
metadata:
  name: crowdsec-secret
  namespace: crowdsec
spec:
  refreshInterval: 1h
  secretStoreRef:
    name: bitwarden-secretsmanager
    kind: ClusterSecretStore
  data:
    - secretKey: ENROLL_KEY
      remoteRef:
        key: "375e115d-3032-420f-9cfa-b49300e29bde"
    - secretKey: DB_PASSWORD
      remoteRef:
        key: "3659cae9-e6c0-43ad-9956-b37501258705"
    - secretKey: BOUNCER_KEY_traefik
      remoteRef:
        key: "2edee0e8-5337-443b-b85f-b49300e4bd7b"
