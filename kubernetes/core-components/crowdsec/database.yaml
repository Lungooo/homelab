---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: psql-cluster-crowdsec
  namespace: prod
spec:
  cluster:
    name: psql-cluster
  name: crowdsec
  login: true
  passwordSecret:
    name: psql-cluster-crowdsec-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: psql-cluster-crowdsec
  namespace: prod
spec:
  name: crowdsec
  owner: crowdsec
  cluster:
    name: psql-cluster
