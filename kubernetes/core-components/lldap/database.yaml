---
apiVersion: postgresql.cnpg.io/v1
kind: DatabaseRole
metadata:
  name: psql-cluster-lldap
  namespace: prod
spec:
  cluster:
    name: psql-cluster
  name: lldap
  login: true
  passwordSecret:
    name: psql-cluster-lldap-role
---
apiVersion: postgresql.cnpg.io/v1
kind: Database
metadata:
  name: psql-cluster-lldap
  namespace: prod
spec:
  name: lldap
  owner: lldap
  cluster:
    name: psql-cluster
