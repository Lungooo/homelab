---
apiVersion: v1
kind: ConfigMap
metadata:
  name: lldap-config
data:
  TZ: "Europe/Berlin"
  LLDAP_LDAP_BASE_DN: "dc=lungoo,dc=dev"
  LLDAP_HTTP_URL: "https://lldap.lungoo.dev"
  LLDAP_SMTP_OPTIONS__ENABLE_PASSWORD_RESET: "true"
  LLDAP_SMTP_OPTIONS__PORT: "465"
  LLDAP_SMTP_OPTIONS__SMTP_ENCRYPTION: "TLS"
  LLDAP_SMTP_OPTIONS__FROM: "LLDAP <lldap@lungoo.dev>"
