---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

helmCharts:
  - namespace: traefik-external
    name: traefik
    releaseName: traefik-external
    repo: https://helm.traefik.io/traefik
    includeCRDs: true
    valuesFile: external-values.yaml
    version: 41.2.0

resources:
  - ../base
  - networkpolicy.yaml
