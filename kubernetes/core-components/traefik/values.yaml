---
deployment:
  enabled: true
  replicas: 3
  annotations: {}
  podAnnotations: {}
  additionalContainers: []
  initContainers: []

ingressRoute:
  dashboard:
    enabled: true
    matchRule: Host(`traefik.home.lungoo.de`)
    entryPoints:
      - websecure
    tls:
      secretName: home-lungoo-de-tls

providers:
  kubernetesCRD:
    enabled: true
    ingressClass: traefik-external
    allowExternalNameServices: true
  kubernetesIngress:
    enabled: true
    allowExternalNameServices: true
    publishedService:
      enabled: false

logs:
  general:
    level: "INFO"

global:
  checkNewVersion: false
  sendAnonymousUsage: false

additionalArguments:
  - "--api.disabledashboardad"
  - "--entrypoints.pg.address=:5432/tcp"

ports:
  web:
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          priority: 10
  websecure:
    http:
      tls:
        enabled: true
      middlewares:
        - traefik-securityheaders@kubernetescrd
    transport:
      respondingTimeouts:
        readTimeout: 300s
        idleTimeout: 300s
  pg:
    port: 5432
    expose:
      default: true
    exposedPort: 5432
    protocol: TCP

service:
  enabled: true
  type: LoadBalancer
  annotations: {}
  labels: {}
  spec:
    loadBalancerIP: 10.0.10.180
    externalTrafficPolicy: Local
  loadBalancerSourceRangers: []
  externalIPs: []

rbac:
  enabled: true

nodeSelector:
  node-role.kubernetes.io/control-plane: "true"
