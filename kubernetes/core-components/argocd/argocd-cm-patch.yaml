---
apiVersion: v1
kind: ConfigMap
metadata:
  name: argocd-cm
data:
  oidc.config: |
    name: 'Authelia'
    issuer: 'https://auth.home.lungoo.de'
    clientID: 'fJWiJmdDLRiArZhkGtclNvbX3KBMShSyLhyT9WA690pqWHdPhMAGohVkfCp5IdI7'
    clientSecret: $oidc-secret:oidc.auth0.clientSecret
    cliClientID: 'aEnjdpsFfqAqIpZaj5bScoaWfwpTPHPwxCANKToF8PowY0ZZ4ZjzmnHfuGXzA6Y0'
    requestedScopes:
      - 'openid'
      - 'email'
      - 'groups'
    enableUserInfoGroups: true
    userInfoPath: '/api/oidc/userinfo'
  kustomize.buildOptions: "--enable-helm"
  application.instanceLabelKey: argocd.argoproj.io/instance
  resource.exclusions: >
    ### Network resources created by the Kubernetes control plane and excluded
    to reduce the number of watched events and UI clutter

    - apiGroups:
      - ''
      - discovery.k8s.io
      kinds:
      - Endpoints
    ### Internal Kubernetes resources excluded reduce the number of watched
    events

    - apiGroups:
      - coordination.k8s.io
      kinds:
      - Lease
    ### Internal Kubernetes Authz/Authn resources excluded reduce the number of
    watched events

    - apiGroups:
      - authentication.k8s.io
      - authorization.k8s.io
      kinds:
      - SelfSubjectReview
      - TokenReview
      - LocalSubjectAccessReview
      - SelfSubjectAccessReview
      - SelfSubjectRulesReview
      - SubjectAccessReview
    ### Intermediate Certificate Request excluded reduce the number of watched
    events

    - apiGroups:
      - certificates.k8s.io
      kinds:
      - CertificateSigningRequest
    - apiGroups:
      - cert-manager.io
      kinds:
      - CertificateRequest
    ### Cilium internal resources excluded reduce the number of watched events
    and UI Clutter

    - apiGroups:
      - cilium.io
      kinds:
      - CiliumIdentity
      - CiliumEndpoint
      - CiliumEndpointSlice
    ### Kyverno intermediate and reporting resources excluded reduce the number
    of watched events and improve performance

    - apiGroups:
      - kyverno.io
      - reports.kyverno.io
      - wgpolicyk8s.io
      kinds:
      - PolicyReport
      - ClusterPolicyReport
      - EphemeralReport
      - ClusterEphemeralReport
      - AdmissionReport
      - ClusterAdmissionReport
      - BackgroundScanReport
      - ClusterBackgroundScanReport
      - UpdateRequest
