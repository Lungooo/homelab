---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: ghcr.io/valkey-io/valkey
    newTag: 9.1.2@sha256:a91d34ab33975b1054e26f1bd9995b268f7e0c507b5ded7f3d181a1a25521630

helmCharts:
  - namespace: authelia
    name: authelia
    releaseName: authelia
    repo: https://charts.authelia.com
    includeCRDs: true
    valuesFile: values.yaml
    version: 0.11.20

resources:
  - database.yaml
  - deployment-valkey.yaml
  - ingress.yaml
  - middleware.yaml
  - pvc.yaml
  - secrets.yaml
  - service.yaml
  - serviceaccount.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: authelia
    path: authelia-deploy-patch.yaml
