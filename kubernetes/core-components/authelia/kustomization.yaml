---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: ghcr.io/valkey-io/valkey
    newTag: 9.1.2@sha256:418652cfb58ef879d4978c33553735d7147016032d5aefaa14c828e611eb9dfd

helmCharts:
  - namespace: authelia
    name: authelia
    releaseName: authelia
    repo: https://charts.authelia.com
    includeCRDs: true
    valuesFile: values.yaml
    version: 0.11.22

resources:
  - database.yaml
  - deployment-valkey.yaml
  - ingress.yaml
  - middleware.yaml
  - pvc.yaml
  - secrets.yaml
  - service.yaml
  - serviceaccount.yaml

patches:
  - target:
      group: apps
      version: v1
      kind: Deployment
      name: authelia
    path: authelia-deploy-patch.yaml
