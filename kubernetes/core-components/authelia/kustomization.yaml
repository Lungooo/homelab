---
apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

images:
  - name: ghcr.io/valkey-io/valkey
    newTag: 9.1.0@sha256:8e8d64b405ce18f41b8e5ee20aa4687a8ed0022d1298f2ce31cdcf3a76e09411

helmCharts:
  - namespace: authelia
    name: authelia
    releaseName: authelia
    repo: https://charts.authelia.com
    includeCRDs: true
    valuesFile: values.yaml
    version: 0.11.6

resources:
  - database.yaml
  - deployment-valkey.yaml
  - ingress.yaml
  - middleware.yaml
  - pvc.yaml
  - secrets.yaml
  - service.yaml
  - serviceaccount.yaml

patches:
  - path: authelia-deploy-patch.yaml
