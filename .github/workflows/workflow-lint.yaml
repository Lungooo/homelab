---
name: Workflow lint
on:
  pull_request:
    branches:
      - main
    paths:
      - ".github/workflows/**"

permissions:
  contents: read
  pull-requests: read

jobs:
  changed-workflows:
    runs-on: arc-runner-set
    name: Find changed workflow files
    container:
      image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
    outputs:
      workflows_matrix: ${{ steps.changed-workflows.outputs.workflows_matrix }}
    steps:
      - name: Checkout repo
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Get changed files
        id: changed-files
        uses: tj-actions/changed-files@v47
        with:
          matrix: true
          dir_names: false

      - name: List all changed files
        run: echo '${{ steps.changed-files.outputs.all_changed_files }}'

      - name: Filter workflows matrix
        id: changed-workflows
        run: |
          CHANGED_FILES='${{ steps.changed-files.outputs.all_changed_files }}'
          WORKFLOWS=$(echo $CHANGED_FILES | jq -r '.[] | select(startswith(".github"))' | jq -R . | jq -sc .)
          echo "Filtered matrix: $WORKFLOWS"
          echo workflows_matrix=$WORKFLOWS >> $GITHUB_OUTPUT
        shell: bash

  validation:
    runs-on: arc-runner-set
    name: Validate ${{ matrix.workflow }}
    needs: changed-workflows
    container:
      image: pipelinecomponents/yamllint:0.35.27@sha256:f7f7b4f8824839e33690a880dbe20944128b0dc9c55522a0b92a29b3a905cecf
    strategy:
      matrix:
        workflow: ${{ fromJSON(needs.changed-workflows.outputs.workflows_matrix) }}
    steps:
      - name: Checkout repo content
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: yamllint
        run: |
          yamllint -c _yamllint.yaml ${{ matrix.workflow }}

  validation-result:
    runs-on: arc-runner-set
    name: Validation result
    needs: validation
    container:
      image: alpine/k8s:1.37.2@sha256:7a82aeefea3d554a43a8676b137f2b88bae6c1fe11c13862b191b3a086cc28c0
    steps:
      - name: Set status based on build
        run: |
          if [ "${{ needs.validation.result }}" == "success" ]; then
            echo "Validation succeeded."
          else
            echo "Validation failed."
            exit 1
          fi
